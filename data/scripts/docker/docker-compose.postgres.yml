services:
  postgres:
    image: postgres:16
    container_name: educartion-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ../:/sql:ro
      - educartion-pgdata:/var/lib/postgresql/data

volumes:
  educartion-pgdata:

